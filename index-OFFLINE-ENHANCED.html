<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKroon Notification System - Premium Edition</title>
    
    <!-- FONTS: Orbitron (Headers) & Fira Code (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Fira+Code:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           PART 1: CSS VARIABLES & THEME CONFIGURATION
           ============================================ */
        :root {
            /* Primary Color Palette */
            --gk-navy: #0a1124;
            --gk-black: #050505;
            --gk-white: #ffffff;
            --gk-gray: #d0d0d0;
            
            /* Neon Accent Colors */
            --gk-orange: #ff9f1c;
            --gk-lime: #33ff00;
            --gk-red: #ff003c;
            --gk-cyan: #00ffff;
            --gk-purple: #b537f2;
            --gk-pink: #ff006e;
            
            /* Gradients */
            --glass-bg: linear-gradient(135deg, rgba(10, 17, 36, 0.95) 0%, rgba(2, 5, 10, 0.98) 100%);
            --premium-grad: linear-gradient(135deg, #0a1124 0%, #1a2a4e 50%, #050505 100%);
            
            /* Responsive Sizing */
            --mobile-bottom: 20px;
            --mobile-right: 20px;
            --desktop-bottom: 40px;
            --desktop-right: 40px;
            
            /* Shadows & Effects */
            --glow-sm: 0 0 15px;
            --glow-md: 0 0 30px;
            --glow-lg: 0 0 50px;
            
            /* Animation Timing */
            --transition-fast: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            --transition-smooth: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ============================================
           PART 2: GLOBAL STYLES & RESET
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #0a0e27 100%);
            font-family: 'Fira Code', monospace;
            color: var(--gk-white);
            position: relative;
        }

        /* Animated Background Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(51, 255, 0, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 159, 28, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
            animation: gk-ambient-shift 20s ease-in-out infinite;
        }

        @keyframes gk-ambient-shift {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============================================
           PART 3: MAIN CONTAINER & POSITIONING
           ============================================ */
        .gk-terminal-container {
            position: fixed;
            bottom: var(--desktop-bottom);
            right: var(--desktop-right);
            z-index: 9999;
            perspective: 1200px;
            cursor: pointer;
            
            /* Entrance Animation */
            animation: gk-entrance 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0;
            transform: translateY(100px);
            
            /* Mobile Responsiveness */
            --bottom: var(--desktop-bottom);
            --right: var(--desktop-right);
        }

        @media (max-width: 768px) {
            .gk-terminal-container {
                bottom: var(--mobile-bottom);
                right: var(--mobile-right);
            }
        }

        /* ============================================
           PART 4: TERMINAL WINDOW - 3D CARD EFFECT
           ============================================ */
        .gk-terminal-window {
            width: 280px;
            background: var(--glass-bg);
            border: 2px solid var(--gk-orange);
            border-radius: 12px;
            
            /* Advanced Shadow & Glow System */
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(255, 159, 28, 0.4),
                0 0 40px rgba(255, 159, 28, 0.1),
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            
            overflow: hidden;
            transition: var(--transition-smooth);
            
            /* 3D Idle State */
            transform: rotateY(-25deg) rotateX(10deg) translateZ(20px);
            transform-style: preserve-3d;
            position: relative;
            backface-visibility: hidden;
            
            /* Floating Animation */
            animation: gk-levitate 8s ease-in-out infinite;
        }

        @keyframes gk-levitate {
            0%, 100% { transform: rotateY(-25deg) rotateX(10deg) translateZ(20px) translateY(0px); }
            50% { transform: rotateY(-25deg) rotateX(10deg) translateZ(20px) translateY(-20px); }
        }

        /* ============================================
           PART 5: HOVER STATE TRANSFORMATION
           ============================================ */
        .gk-terminal-container:hover .gk-terminal-window {
            width: 440px;
            border-color: var(--gk-lime);
            background: linear-gradient(135deg, rgba(5, 5, 8, 0.98) 0%, rgba(10, 17, 36, 0.95) 100%);
            
            /* Snap to 2D */
            transform: rotateY(0deg) rotateX(0deg) translateZ(0) scale(1.08);
            
            /* Enhanced Lime Glow */
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(51, 255, 0, 0.35),
                0 0 60px rgba(51, 255, 0, 0.15),
                inset 0 0 20px rgba(51, 255, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            
            animation: none;
        }

        /* Mobile Hover Fix */
        @media (max-width: 768px) {
            .gk-terminal-container:active .gk-terminal-window {
                width: 90vw;
                max-width: 440px;
                transform: rotateY(0deg) rotateX(0deg) translateZ(0) scale(1.05);
            }
        }

        /* ============================================
           PART 6: TERMINAL HEADER
           ============================================ */
        .gk-terminal-header {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.5) 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            position: relative;
            z-index: 3;
        }

        .gk-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .gk-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: relative;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 6px currentColor);
        }

        .gk-dot.red {
            background: var(--gk-red);
            box-shadow: 0 0 12px var(--gk-red), inset 0 0 4px rgba(255, 0, 60, 0.8);
            animation: gk-pulse-red 2s infinite;
        }

        .gk-dot.orange {
            background: var(--gk-orange);
            box-shadow: 0 0 8px var(--gk-orange);
        }

        .gk-dot.lime {
            background: var(--gk-lime);
            box-shadow: 0 0 8px var(--gk-lime);
        }

        .gk-terminal-container:hover .gk-dot.lime {
            animation: gk-pulse-lime 1.5s infinite;
        }

        .gk-title {
            color: var(--gk-white);
            font-size: 10px;
            font-weight: 900;
            margin-left: auto;
            opacity: 0.7;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.3);
            letter-spacing: 3px;
            transition: var(--transition-fast);
        }

        .gk-terminal-container:hover .gk-title {
            opacity: 1;
            text-shadow: 0 0 15px rgba(51, 255, 0, 0.6);
            color: var(--gk-lime);
        }

        /* ============================================
           PART 7: TERMINAL BODY & CONTENT
           ============================================ */
        .gk-terminal-body {
            padding: 24px;
            color: var(--gk-white);
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            min-height: 80px;
            position: relative;
            z-index: 2;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Scrollbar Styling */
        .gk-terminal-body::-webkit-scrollbar {
            width: 6px;
        }

        .gk-terminal-body::-webkit-scrollbar-track {
            background: rgba(51, 255, 0, 0.05);
            border-radius: 10px;
        }

        .gk-terminal-body::-webkit-scrollbar-thumb {
            background: rgba(51, 255, 0, 0.3);
            border-radius: 10px;
            transition: background 0.3s;
        }

        .gk-terminal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(51, 255, 0, 0.6);
        }

        .gk-line {
            display: flex;
            margin-bottom: 12px;
            align-items: flex-start;
            line-height: 1.6;
            word-break: break-word;
            animation: gk-line-fade 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes gk-line-fade {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .gk-line:nth-child(1) { animation-delay: 0s; }
        .gk-line:nth-child(2) { animation-delay: 0.1s; }
        .gk-line:nth-child(3) { animation-delay: 0.2s; }

        /* Static Content (Always Visible) */
        .gk-line.static {
            display: flex;
            opacity: 1;
            animation: none;
        }

        /* Dynamic Content (Hidden Until Hover) */
        .gk-line.dynamic {
            display: none;
            align-items: flex-start;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed rgba(51, 255, 0, 0.2);
            flex-wrap: wrap;
            gap: 8px;
        }

        .gk-terminal-container:hover .gk-line.dynamic {
            display: flex;
            animation: gk-slide-down 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes gk-slide-down {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           PART 8: TEXT ELEMENTS & TYPOGRAPHY
           ============================================ */
        .gk-prompt {
            color: var(--gk-orange);
            margin-right: 10px;
            font-weight: bold;
            font-size: 14px;
            transition: color var(--transition-fast);
            flex-shrink: 0;
        }

        .gk-terminal-container:hover .gk-prompt {
            color: var(--gk-lime);
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.5);
        }

        .gk-cmd {
            color: var(--gk-lime);
            font-weight: 700;
            font-size: 12px;
            opacity: 0.95;
            letter-spacing: 1px;
            transition: text-shadow var(--transition-fast);
        }

        .gk-terminal-container:hover .gk-cmd {
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.4);
        }

        .gk-msg {
            color: var(--gk-gray);
            font-weight: 400;
            line-height: 1.5;
            flex-wrap: wrap;
        }

        /* ============================================
           PART 9: STATUS BADGE & INDICATORS
           ============================================ */
        .gk-status-badge {
            background: rgba(255, 0, 60, 0.15);
            color: var(--gk-red);
            border: 1.5px solid var(--gk-red);
            padding: 4px 12px;
            border-radius: 6px;
            margin-left: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.25);
            animation: gk-pulse-red 2s infinite;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .gk-terminal-container:hover .gk-status-badge {
            border-color: var(--gk-lime);
            color: var(--gk-lime);
            background: rgba(51, 255, 0, 0.1);
            box-shadow: 0 0 15px rgba(51, 255, 0, 0.3);
        }

        .gk-status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gk-red);
            margin-left: 6px;
            box-shadow: 0 0 8px var(--gk-red);
            animation: gk-pulse-indicator 1s infinite;
        }

        @keyframes gk-pulse-indicator {
            0%, 100% { box-shadow: 0 0 8px var(--gk-red); }
            50% { box-shadow: 0 0 16px var(--gk-red); }
        }

        /* ============================================
           PART 10: VISUAL EFFECTS & OVERLAYS
           ============================================ */

        /* CRT Scanline Effect */
        .gk-scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 50%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.15) 100%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.3;
        }

        /* Noise Effect */
        .gk-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" result="noise" seed="2"/></filter><rect width="100%" height="100%" fill="white" filter="url(%23noise)" opacity="0.02"/></svg>');
            pointer-events: none;
            z-index: 11;
            animation: gk-shift-noise 0.3s steps(2) infinite;
        }

        @keyframes gk-shift-noise {
            0% { transform: translate(0, 0); }
            100% { transform: translate(2px, 2px); }
        }

        /* Reflective Shine */
        .gk-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 20%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 80%
            );
            transform: rotate(45deg);
            opacity: 0;
            pointer-events: none;
            z-index: 12;
        }

        .gk-terminal-container:hover .gk-shine {
            animation: gk-shine-sweep 0.6s ease-out;
        }

        @keyframes gk-shine-sweep {
            0% { opacity: 0; transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { opacity: 0.3; }
            100% { opacity: 0; transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        /* ============================================
           PART 11: ANIMATION KEYFRAMES
           ============================================ */

        @keyframes gk-entrance {
            0% { opacity: 0; transform: translateY(100px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0px) scale(1); }
        }

        @keyframes gk-pulse-red {
            0% { box-shadow: 0 0 8px rgba(255, 0, 60, 0.3); }
            50% { box-shadow: 0 0 16px rgba(255, 0, 60, 0.7); }
            100% { box-shadow: 0 0 8px rgba(255, 0, 60, 0.3); }
        }

        @keyframes gk-pulse-lime {
            0% { box-shadow: 0 0 8px var(--gk-lime); }
            50% { box-shadow: 0 0 16px var(--gk-lime); }
            100% { box-shadow: 0 0 8px var(--gk-lime); }
        }

        /* Cursor Blinking */
        .gk-cursor {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: var(--gk-lime);
            margin-left: 4px;
            animation: gk-blink 0.7s step-end infinite;
            vertical-align: middle;
            flex-shrink: 0;
        }

        @keyframes gk-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* ============================================
           PART 12: RESPONSIVE DESIGN & MEDIA QUERIES
           ============================================ */

        @media (max-width: 1024px) {
            .gk-terminal-window {
                width: 260px;
            }

            .gk-terminal-container:hover .gk-terminal-window {
                width: 380px;
            }

            .gk-terminal-body {
                padding: 18px;
                font-size: 12px;
            }

            .gk-line {
                margin-bottom: 10px;
            }
        }

        @media (max-width: 768px) {
            .gk-terminal-window {
                width: 240px;
            }

            .gk-terminal-container:hover .gk-terminal-window {
                width: 85vw;
                max-width: 400px;
            }

            .gk-terminal-header {
                padding: 10px 12px;
            }

            .gk-terminal-body {
                padding: 16px;
                font-size: 11px;
                min-height: 60px;
            }

            .gk-title {
                font-size: 9px;
            }

            .gk-dot {
                width: 10px;
                height: 10px;
            }

            .gk-status-badge {
                padding: 3px 8px;
                font-size: 9px;
            }
        }

        @media (max-width: 480px) {
            .gk-terminal-container {
                bottom: 15px;
                right: 15px;
            }

            .gk-terminal-window {
                width: 90vw;
                min-width: 200px;
            }

            .gk-terminal-container:hover .gk-terminal-window {
                width: 95vw;
                transform: rotateY(0deg) rotateX(0deg) scale(1.02);
            }

            .gk-terminal-body {
                padding: 12px;
                font-size: 10px;
                min-height: 50px;
            }

            .gk-prompt {
                margin-right: 6px;
                font-size: 12px;
            }

            .gk-cmd {
                font-size: 11px;
            }
        }

        /* ============================================
           PART 13: ACCESSIBILITY & DARK MODE
           ============================================ */

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #000000 0%, #0a0e1a 50%, #000000 100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus Styles for Accessibility */
        .gk-terminal-container:focus-visible {
            outline: 2px solid var(--gk-lime);
            outline-offset: 4px;
        }

        /* ============================================
           PART 14: PRINT STYLES
           ============================================ */

        @media print {
            .gk-terminal-container {
                display: none;
            }
        }

    </style>
</head>
<body>

    <!-- NOTIFICATION COMPONENT START -->
    <div id="gk-terminal-badge" class="gk-terminal-container" role="status" aria-live="polite" tabindex="0">
        <div class="gk-terminal-window">
            
            <!-- Window Header -->
            <div class="gk-terminal-header">
                <div class="gk-controls">
                    <span class="gk-dot red" aria-label="System Status: Offline"></span>
                    <span class="gk-dot orange" aria-label="Monitoring Active"></span>
                    <span class="gk-dot lime" aria-label="Connection Ready"></span>
                </div>
                <span class="gk-title">⚡ SYSTEM_OVERRIDE // GKROON</span>
            </div>
            
            <!-- Terminal Body -->
            <div class="gk-terminal-body">
                <!-- Static Idle State Content -->
                <div class="gk-line static">
                    <span class="gk-prompt">➜</span> 
                    <span class="gk-cmd">STATUS_CHECK:</span> 
                    <span class="gk-status-badge">
                        OFFLINE 
                        <span class="gk-status-indicator"></span>
                    </span>
                </div>

                <!-- Static System Info -->
                <div class="gk-line static">
                    <span class="gk-prompt">➜</span>
                    <span class="gk-cmd">SYSTEM_INFO:</span>
                    <span class="gk-msg" style="color: #a0a0a0;">
                        Maintenance Mode Active
                    </span>
                </div>
                
                <!-- Dynamic Content (Typewriter) - Shown on Hover -->
                <div class="gk-line dynamic">
                    <span class="gk-prompt">➜</span> 
                    <span class="gk-msg">
                        <span id="gk-typewriter"></span><span class="gk-cursor"></span>
                    </span>
                </div>

                <!-- Additional Dynamic Lines -->
                <div class="gk-line dynamic">
                    <span class="gk-prompt">➜</span>
                    <span class="gk-cmd">ESTIMATED_RETURN:</span>
                    <span class="gk-msg" style="color: #ffa500;" id="gk-eta">
                        [CALCULATING...]
                    </span>
                </div>

                <!-- Social Links -->
                <div class="gk-line dynamic">
                    <span class="gk-prompt">➜</span>
                    <span class="gk-cmd">CONNECT:</span>
                    <span class="gk-msg" id="gk-links-container" style="gap: 6px; margin-top: 4px;"></span>
                </div>
            </div>
            
            <!-- Effects Layers -->
            <div class="gk-scanline"></div>
            <div class="gk-noise"></div>
            <div class="gk-shine"></div>
        </div>
    </div>
    <!-- NOTIFICATION COMPONENT END -->

    <script>
        /* ============================================
           ENHANCED JAVASCRIPT - PART 1: CONFIGURATION
           ============================================ */

        (function() {
            'use strict';

            // DOM Elements
            const container = document.getElementById('gk-terminal-badge');
            const typeWriterElement = document.getElementById('gk-typewriter');
            const etaElement = document.getElementById('gk-eta');
            const linksContainer = document.getElementById('gk-links-container');

            // Configuration Object
            const CONFIG = {
                messages: [
                    "👋 Hello & Welcome to GKroon. We're currently offline for maintenance and updates. Stay tuned for a refreshed experience.",
                    "🔧 System upgrades in progress. Our engineering team is working hard behind the scenes.",
                    "⚡ Premium features loading. Expect an incredible new interface soon!",
                    "🚀 Exciting things coming your way. Check back soon for surprises!"
                ],
                typingSpeed: 30, // milliseconds per character
                socialLinks: [
                    { text: '[github]', url: 'https://github.com', color: '#d0d0d0' },
                    { text: '[twitter]', url: 'https://twitter.com', color: '#00acee' },
                    { text: '[discord]', url: 'https://discord.com', color: '#5865f2' }
                ],
                timeFormat: {
                    locale: 'en-US',
                    hour12: true,
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit'
                }
            };

            /* ============================================
               ENHANCED JAVASCRIPT - PART 2: STATE MANAGEMENT
               ============================================ */

            const state = {
                isHovering: false,
                isTyping: false,
                currentMessageIndex: 0,
                completionPercentage: 0,
                animationFrameId: null
            };

            /* ============================================
               ENHANCED JAVASCRIPT - PART 3: UTILITY FUNCTIONS
               ============================================ */

            /**
             * Format time for display
             * @returns {string} Formatted time string
             */
            function getFormattedTime() {
                const now = new Date();
                return now.toLocaleTimeString(
                    CONFIG.timeFormat.locale,
                    CONFIG.timeFormat
                );
            }

            /**
             * Calculate estimated return time (random between 2-6 hours)
             * @returns {string} Estimated return time
             */
            function calculateETA() {
                const now = new Date();
                const eta = new Date(now.getTime() + Math.random() * (6 - 2) * 60 * 60 * 1000);
                const hours = String(eta.getHours()).padStart(2, '0');
                const minutes = String(eta.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes} UTC`;
            }

            /**
             * Get a random message from the pool
             * @returns {string} Random message
             */
            function getRandomMessage() {
                const index = Math.floor(Math.random() * CONFIG.messages.length);
                return CONFIG.messages[index];
            }

            /**
             * Render social links dynamically
             */
            function renderSocialLinks() {
                linksContainer.innerHTML = CONFIG.socialLinks.map(link => {
                    return `<a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                                   style="color: ${link.color}; text-decoration: none; transition: text-shadow 0.3s;"
                                   onmouseover="this.style.textShadow='0 0 10px ${link.color}80'"
                                   onmouseout="this.style.textShadow='none'">${link.text}</a>`;
                }).join('');
            }

            /* ============================================
               ENHANCED JAVASCRIPT - PART 4: TYPEWRITER LOGIC
               ============================================ */

            /**
             * Advanced Typewriter Effect with Character-by-Character Rendering
             */
            function typeWriter(text, onComplete = null) {
                let charIndex = 0;
                const totalChars = text.length;
                typeWriterElement.textContent = '';
                state.isTyping = true;

                function type() {
                    if (charIndex < totalChars && state.isHovering) {
                        const char = text.charAt(charIndex);
                        typeWriterElement.textContent += char;
                        charIndex++;

                        // Update completion percentage
                        state.completionPercentage = Math.round(
                            (charIndex / totalChars) * 100
                        );

                        state.animationFrameId = setTimeout(type, CONFIG.typingSpeed);
                    } else if (charIndex >= totalChars) {
                        state.isTyping = false;
                        if (onComplete) onComplete();
                    }
                }

                type();
            }

            /**
             * Clear typewriter text
             */
            function clearTypeWriter() {
                clearTimeout(state.animationFrameId);
                typeWriterElement.textContent = '';
                state.isTyping = false;
            }

            /* ============================================
               ENHANCED JAVASCRIPT - PART 5: EVENT HANDLERS
               ============================================ */

            /**
             * Handle Mouse Enter - Trigger Typing Animation
             */
            function handleMouseEnter() {
                state.isHovering = true;

                // Update ETA
                etaElement.textContent = calculateETA();

                // Render social links (if not already rendered)
                if (linksContainer.children.length === 0) {
                    renderSocialLinks();
                }

                // Start typewriter with random message
                const message = getRandomMessage();
                typeWriter(message);
            }

            /**
             * Handle Mouse Leave - Stop Typing & Clear
             */
            function handleMouseLeave() {
                state.isHovering = false;
                clearTypeWriter();
            }

            /**
             * Handle Keyboard Interaction (Accessibility)
             */
            function handleKeyDown(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (!state.isHovering) {
                        handleMouseEnter();
                    } else {
                        handleMouseLeave();
                    }
                }
            }

            /* ============================================
               ENHANCED JAVASCRIPT - PART 6: INITIALIZATION
               ============================================ */

            /**
             * Initialize the component
             */
            function init() {
                // Add Event Listeners
                container.addEventListener('mouseenter', handleMouseEnter);
                container.addEventListener('mouseleave', handleMouseLeave);
                container.addEventListener('keydown', handleKeyDown);

                // Mobile Touch Support
                container.addEventListener('touchstart', handleMouseEnter);
                container.addEventListener('touchend', handleMouseLeave);

                // Log Initialization
                console.log('%c🚀 GKroon Terminal Ready!', 'color: #33ff00; font-size: 16px; font-weight: bold;');
                console.log('%cVersion: 2.0 PREMIUM', 'color: #ff9f1c;');
                console.log('%cStatus: OFFLINE - Maintenance Mode', 'color: #ff003c;');
            }

            /**
             * Cleanup Function
             */
            function cleanup() {
                clearTimeout(state.animationFrameId);
                container.removeEventListener('mouseenter', handleMouseEnter);
                container.removeEventListener('mouseleave', handleMouseLeave);
                container.removeEventListener('keydown', handleKeyDown);
            }

            /* ============================================
               ENHANCED JAVASCRIPT - PART 7: LIFECYCLE
               ============================================ */

            // Initialize on DOM Ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // Cleanup on Page Unload
            window.addEventListener('beforeunload', cleanup);

            /* ============================================
               ENHANCED JAVASCRIPT - PART 8: PERFORMANCE & DEBUGGING
               ============================================ */

            // Expose API for debugging (optional, comment out for production)
            window.GKroonTerminal = {
                state,
                CONFIG,
                getStats: () => ({
                    isHovering: state.isHovering,
                    isTyping: state.isTyping,
                    completionPercentage: state.completionPercentage,
                    currentTime: getFormattedTime(),
                    eta: calculateETA()
                }),
                forceMessage: (index) => {
                    state.isHovering = true;
                    typeWriter(CONFIG.messages[index]);
                },
                log: () => {
                    console.table(window.GKroonTerminal.getStats());
                }
            };

        })();
    </script>
</body>
</html>
